version: 2
updates:
  # Enable version updates for Python Deps (this project is uv-managed:
  # pyproject.toml + uv.lock). The "pip" ecosystem doesn't understand the
  # lockfile and produced stale, orphaned PRs.
  - package-ecosystem: "uv"
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Enable version updates for Docker
  - package-ecosystem: "docker"
    # Look for a `Dockerfile` in the `root` directory
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
