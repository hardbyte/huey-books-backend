timeout: 7200s
steps:
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - --no-cache
  - -t
  - $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - -t
  - $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:latest
  - .
  - -f
  - Dockerfile
  id: Build
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  id: Push
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:latest
  id: PushLatestTag
- name: gcr.io/cloud-builders/docker
  id: BuildBrowserVerifier
  args:
  - build
  - -f
  - e2e-live/Dockerfile
  - -t
  - $_GCR_HOSTNAME/$PROJECT_ID/chat-verifier:$COMMIT_SHA
  - .
- name: gcr.io/cloud-builders/docker
  id: PushBrowserVerifier
  args:
  - push
  - $_GCR_HOSTNAME/$PROJECT_ID/chat-verifier:$COMMIT_SHA
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  id: AcquireDeploymentLease
  entrypoint: python3
  args:
  - deploy/lease.py
  - acquire
  - --project=$PROJECT_ID
  - --owner=$BUILD_ID
- name: gcr.io/cloud-builders/docker
  id: RunDevelopmentMigration
  entrypoint: bash
  args:
  - -c
  - |
    docker run -i \
    --network=cloudbuild \
    -e CLOUD_SQL_INSTANCE=wriveted-api:australia-southeast1:wriveted-development \
    -e POSTGRESQL_PASSWORD=$$POSTGRESQL_PASSWORD \
    -e SENDGRID_API_KEY=foo \
    -e SHOPIFY_HMAC_SECRET=foo \
    -e SECRET_KEY=CHrUJmNw1haKVSorf3ooW-D6eRooePyo-V8II--We781 \
    --entrypoint bash \
    --volume $(pwd)/.cloudbuild/scripts/:/scripts/ \
    $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
    -c '/scripts/database_migrate.sh'
  secretEnv:
  - POSTGRESQL_PASSWORD
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  id: DeployAndVerifyDevelopment
  entrypoint: python3
  args:
  - deploy/release.py
  - create
  - --project=$PROJECT_ID
  - --region=$_DEPLOY_REGION
  - --release=r-$SHORT_SHA-${BUILD_ID}
  - --image=$_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - --verifier-image=$_GCR_HOSTNAME/$PROJECT_ID/chat-verifier:$COMMIT_SHA
  - --ui-url=$_CHAT_UI_URL
  - --owner=$BUILD_ID
- name: gcr.io/cloud-builders/docker
  id: RunMigration
  entrypoint: bash
  args:
  - -c
  - |
    docker run -i \
    --network=cloudbuild \
    -e POSTGRESQL_PASSWORD=$$POSTGRESQL_PASSWORD \
    -e SENDGRID_API_KEY=foo \
    -e SHOPIFY_HMAC_SECRET=foo \
    -e SECRET_KEY=CHrUJmNw1haKVSorf3ooW-D6eRooePyo-V8II--We781 \
    --entrypoint bash \
    --volume $(pwd)/.cloudbuild/scripts/:/scripts/ \
    $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
    -c '/scripts/database_migrate.sh'
  secretEnv:
  - POSTGRESQL_PASSWORD
- name: gcr.io/cloud-builders/docker
  id: ReconcileSchoolBilling
  entrypoint: bash
  args:
  - -c
  - |
    docker run -i \
    --network=cloudbuild \
    -e POSTGRESQL_PASSWORD=$$POSTGRESQL_PASSWORD \
    -e STRIPE_SECRET_KEY=$$STRIPE_SECRET_KEY \
    -e SENDGRID_API_KEY=foo \
    -e SHOPIFY_HMAC_SECRET=foo \
    -e SECRET_KEY=CHrUJmNw1haKVSorf3ooW-D6eRooePyo-V8II--We781 \
    --entrypoint bash \
    --volume $(pwd)/.cloudbuild/scripts/:/scripts/ \
    $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
    -c '/scripts/reconcile_school_billing.sh'
  secretEnv:
  - POSTGRESQL_PASSWORD
  - STRIPE_SECRET_KEY
- name: gcr.io/cloud-builders/docker
  id: PgrolesCheck
  entrypoint: bash
  args:
  - -c
  - |
    docker run -i \
    --network=cloudbuild \
    -e POSTGRESQL_PASSWORD=$$POSTGRESQL_PASSWORD \
    -e CLOUD_SQL_INSTANCE=wriveted-api:australia-southeast1:wriveted \
    --entrypoint bash \
    --volume $(pwd)/.cloudbuild/scripts/:/scripts/ \
    --volume $(pwd)/pgroles.yaml:/app/pgroles.yaml \
    $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
    -c 'cd /app && /scripts/pgroles-check.sh'
  secretEnv:
  - POSTGRESQL_PASSWORD
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  id: PromoteAndVerifyProduction
  entrypoint: python3
  args:
  - deploy/release.py
  - promote
  - --project=$PROJECT_ID
  - --region=$_DEPLOY_REGION
  - --release=r-$SHORT_SHA-${BUILD_ID}
  - --target=chat-prod
  - --owner=$BUILD_ID
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  id: ReleaseDeploymentLease
  entrypoint: python3
  args:
  - deploy/lease.py
  - release
  - --project=$PROJECT_ID
  - --owner=$BUILD_ID
availableSecrets:
  secretManager:
  - versionName: projects/wriveted-api/secrets/wriveted-api-cloud-sql-root-password/versions/latest
    env: POSTGRESQL_PASSWORD
  - versionName: projects/wriveted-api/secrets/stripe-live-secret-key/versions/latest
    env: STRIPE_SECRET_KEY
images:
- $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: ALLOW_LOOSE
substitutions:
  _CHAT_UI_URL: https://hueybooks.com
  _GCR_HOSTNAME: asia.gcr.io
  _SERVICE_NAME: wriveted-api
  _DEPLOY_REGION: australia-southeast1
tags:
- gcp-cloud-build-deploy-cloud-run
- gcp-cloud-build-deploy-cloud-run-managed
- wriveted-api
